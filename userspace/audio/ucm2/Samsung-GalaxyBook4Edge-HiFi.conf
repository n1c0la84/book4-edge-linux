# Use case configuration for the Samsung Galaxy Book4 Edge 14" (NP940XMA).
#
# Derived from alsa-ucm-conf ucm2/Qualcomm/x1e80100/HiFi.conf
# (BSD-3-Clause), original author: Krzysztof Kozlowski <krzysztof.kozlowski@linaro.org>.
# Changes for this machine (book4-edge-linux): WSA883x two-speaker sequences
# instead of WSA884x four-speaker ones; Speaker device split into enable/disable;
# internal mic gain raised to 114; tweeter amplifiers TweeterRight/TweeterLeft
# (four-speaker device tree only) switched with the woofers. The tweeters get
# PCM channels 3/4 (RL/RR): feed them only highs (see ../pipewire).

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='MultiMedia4 Mixer VA_CODEC_DMA_TX_0' 1"
	]

	Include.wsae.File "/codecs/wsa883x/DefaultEnableSeq.conf"
	Include.wsm1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsm2e.File "/codecs/qcom-lpass/wsa-macro/Wsa2SpeakerEnableSeq.conf"

	If.tweeters {
		Condition {
			Type ControlExists
			Control "name='TweeterRight PA Volume'"
		}
		True.EnableSequence [
			cset "name='TweeterRight COMP Switch' 1"
			cset "name='TweeterRight BOOST Switch' 1"
			cset "name='TweeterRight DAC Switch' 1"
			cset "name='TweeterRight VISENSE Switch' 0"
			cset "name='TweeterRight WSA MODE' 0"
			cset "name='TweeterLeft COMP Switch' 1"
			cset "name='TweeterLeft BOOST Switch' 1"
			cset "name='TweeterLeft DAC Switch' 1"
			cset "name='TweeterLeft VISENSE Switch' 0"
			cset "name='TweeterLeft WSA MODE' 0"
		]
	}

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Include.wsmspk1e.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerEnableSeq.conf"
	Include.wsmspk2e.File "/codecs/qcom-lpass/wsa-macro/Wsa2SpeakerEnableSeq.conf"
	Include.wsmspk1d.File "/codecs/qcom-lpass/wsa-macro/Wsa1SpeakerDisableSeq.conf"
	Include.wsmspk2d.File "/codecs/qcom-lpass/wsa-macro/Wsa2SpeakerDisableSeq.conf"
	Include.wsaspke.File "/codecs/wsa883x/SpeakerEnableSeq.conf"
	Include.wsaspkd.File "/codecs/wsa883x/SpeakerDisableSeq.conf"

	# Digital gain at the kernel's cap (81 = -3 dB, snd_soc_limit_volume in
	# sound/soc/qcom/x1e80100.c); the boot-time 84 is clamped and lower values
	# saved by alsactl would otherwise stick.
	EnableSequence [
		cset "name='WSA WSA_RX0 Digital Volume' 81"
		cset "name='WSA WSA_RX1 Digital Volume' 81"
		cset "name='WSA2 WSA_RX0 Digital Volume' 81"
		cset "name='WSA2 WSA_RX1 Digital Volume' 81"
	]

	If.tweeters {
		Condition {
			Type ControlExists
			Control "name='TweeterRight PA Volume'"
		}
		True {
			EnableSequence [
				cset "name='TweeterRight COMP Switch' 1"
				cset "name='TweeterRight BOOST Switch' 1"
				cset "name='TweeterRight DAC Switch' 1"
				cset "name='TweeterRight VISENSE Switch' 0"
				cset "name='TweeterRight WSA MODE' 0"
				cset "name='TweeterLeft COMP Switch' 1"
				cset "name='TweeterLeft BOOST Switch' 1"
				cset "name='TweeterLeft DAC Switch' 1"
				cset "name='TweeterLeft VISENSE Switch' 0"
				cset "name='TweeterLeft WSA MODE' 0"
				cset "name='TweeterRight PA Volume' 6"
				cset "name='TweeterLeft PA Volume' 6"
			]
			DisableSequence [
				cset "name='TweeterRight COMP Switch' 0"
				cset "name='TweeterRight BOOST Switch' 0"
				cset "name='TweeterRight DAC Switch' 0"
				cset "name='TweeterRight VISENSE Switch' 0"
				cset "name='TweeterLeft COMP Switch' 0"
				cset "name='TweeterLeft BOOST Switch' 0"
				cset "name='TweeterLeft DAC Switch' 0"
				cset "name='TweeterLeft VISENSE Switch' 0"
			]
		}
	}

	Value {
		PlaybackChannels 4
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Speakers"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneABEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	ConflictingDevice [
		"Mic"
	]

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	ConflictingDevice [
		"Headset"
	]

	Include.vadm0d.File "/codecs/qcom-lpass/va-macro/DMIC0DisableSeq.conf"
	Include.vadm1d.File "/codecs/qcom-lpass/va-macro/DMIC1DisableSeq.conf"

	# Same as codecs/qcom-lpass/va-macro/DMIC{0,1}EnableSeq.conf, inlined so the
	# gain can differ: their VA_DEC0/1 Volume of 100 (+16 dB) is too quiet on
	# this machine (speech around -34 dBFS); 120 clipped on loud speech, so 114 (+30 dB):
	# normal speech around -20 dBFS with headroom. (Overriding after an Include does not work: the
	# included sequence runs last.)
	EnableSequence [
		cset "name='VA DEC0 MUX' VA_DMIC"
		cset "name='VA DMIC MUX0' DMIC0"
		cset "name='VA_AIF1_CAP Mixer DEC0' 1"
		cset "name='VA_DEC0 Volume' 114"
		cset "name='VA DEC1 MUX' VA_DMIC"
		cset "name='VA DMIC MUX1' DMIC1"
		cset "name='VA_AIF1_CAP Mixer DEC1' 1"
		cset "name='VA_DEC1 Volume' 114"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}
