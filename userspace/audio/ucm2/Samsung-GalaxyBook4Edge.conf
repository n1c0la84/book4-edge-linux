Syntax 4

# Samsung Galaxy Book4 Edge 14" (NP940XMA) with the Anatase device tree.
# Derived from alsa-ucm-conf ucm2/Qualcomm/x1e80100/X1E80100-CRD.conf (BSD-3-Clause).
#
# WSA883x speaker amplifiers: woofers SpkrLeft/SpkrRight (one per WSA macro,
# SoundWire address 2) and, with the four-speaker device tree, tweeters
# SpkrLeft2/SpkrRight2 (address 1). The DT names are swapped: SpkrRight is the
# left side. WCD938x headset, 2x DMIC.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Samsung-GalaxyBook4Edge-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"

# "Speakers Volume" in PCM channel order: FL = left woofer, FR = right woofer,
# RL = left tweeter, RR = right tweeter (the stock remap is left/right swapped
# here, and only knows two amplifiers).
If.tweeters {
	Condition {
		Type ControlExists
		Control "name='SpkrLeft2 PA Volume'"
	}
	True.LibraryConfig.remap.Config.ctl.default.map {
		"name='Speakers Volume'" {
			"name='SpkrRight PA Volume'".vindex.0 0
			"name='SpkrLeft PA Volume'".vindex.1 0
			"name='SpkrRight2 PA Volume'".vindex.2 0
			"name='SpkrLeft2 PA Volume'".vindex.3 0
		}
	}
	False.LibraryConfig.remap.Config.ctl.default.map {
		"name='Speakers Volume'" {
			"name='SpkrRight PA Volume'".vindex.0 0
			"name='SpkrLeft PA Volume'".vindex.1 0
		}
	}
}
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/four-speakers/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
