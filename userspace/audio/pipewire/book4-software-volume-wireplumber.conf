# The four-channel Speaker PCM has only a two-channel UCM PA mixer.
# Use software volume for all channels; keep the existing UCM routing/gains.
# This device property also applies to this card's headphones and microphone.
monitor.alsa.rules = [
    {
        matches = [ { device.name = "alsa_card.platform-sound" } ]
        actions = {
            update-props = {
                api.alsa.soft-mixer = true
            }
        }
    }
]
