# Galaxy Book4 Edge 14": stereo "Speakers" output with a crossover for the
# four-speaker device tree. The ALSA Speaker sink has four channels:
#   FL/FR = woofers (full range), RL/RR = tweeters (highs only:
#   4th-order Linkwitz-Riley high-pass at 2 kHz, two Butterworth biquads).
# The tweeters are small (2.7 W) and must not get bass. With the two-speaker
# device tree RL/RR go nowhere and this is a plain stereo sink.
# Install: ~/.config/pipewire/pipewire.conf.d/book4-speakers.conf
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Speakers"
            media.name       = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin name = wL label = copy }
                    { type = builtin name = wR label = copy }
                    { type = builtin name = oL label = copy }
                    { type = builtin name = oR label = copy }
                    { type = builtin name = hL1 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.7071 } }
                    { type = builtin name = hL2 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.7071 } }
                    { type = builtin name = hR1 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.7071 } }
                    { type = builtin name = hR2 label = bq_highpass control = { "Freq" = 2000.0 "Q" = 0.7071 } }
                ]
                links = [
                    { output = "wL:Out"  input = "oL:In" }
                    { output = "wL:Out"  input = "hL1:In" }
                    { output = "hL1:Out" input = "hL2:In" }
                    { output = "wR:Out"  input = "oR:In" }
                    { output = "wR:Out"  input = "hR1:In" }
                    { output = "hR1:Out" input = "hR2:In" }
                ]
                inputs  = [ "wL:In" "wR:In" ]
                outputs = [ "oL:Out" "oR:Out" "hL2:Out" "hR2:Out" ]
            }
            capture.props = {
                node.name        = "book4_speakers"
                media.class      = Audio/Sink
                audio.channels   = 2
                audio.position   = [ FL FR ]
                # WirePlumber smart filter: whatever goes to the Speaker sink
                # passes through here first; headphones are not affected.
                filter.smart      = true
                filter.smart.name = "book4-speakers"
                filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
            }
            playback.props = {
                node.name        = "book4_speakers.output"
                node.passive     = true
                audio.channels   = 4
                audio.position   = [ FL FR RL RR ]
                stream.dont-remix = true
            }
        }
    }
]
