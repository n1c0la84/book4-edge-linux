# Galaxy Book4 Edge 14": streams sent straight to the raw four-channel Speaker
# sink must not be up-mixed into RL/RR, which are the tweeters with the
# four-speaker device tree (full-range audio there is unsafe). Use the
# crossover (book4-speakers.conf), which WirePlumber inserts automatically.
# Install: ~/.config/wireplumber/wireplumber.conf.d/book4-speakers.conf
monitor.alsa.rules = [
    {
        matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
        actions = {
            update-props = {
                channelmix.upmix = false
            }
        }
    }
]
