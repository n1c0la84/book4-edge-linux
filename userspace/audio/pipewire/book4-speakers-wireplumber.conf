# Galaxy Book4 Edge 14": streams sent straight to the raw four-channel Speaker
# sink must not be up-mixed into RL/RR, which are the tweeters with the
# four-speaker device tree (full-range audio there is unsafe). Use the
# crossover (book4-speakers.conf), which WirePlumber inserts automatically.
# Install: ~/.config/wireplumber/wireplumber.conf.d/book4-speakers.conf
monitor.alsa.rules = [
    {
        matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
        actions = {
            update-props = {
                channelmix.upmix = false
                # The DSP moves this PCM in fixed 480-frame periods, so the
                # coarse hw_ptr made the follower's fill swing ~±485 frames:
                # PipeWire "resync" glitches (dirty sound, 25 Nov 2026).
                # Hardware timestamps give it the real delay; with
                # book4-clock.conf (quantum 480) no resync in 6 min of playback.
                api.alsa.htimestamp = true
                # This is the output to select ("Speakers"): the crossover is
                # inserted in front of it automatically, and with it as the
                # default, headphone jack switching works. Volume panels use
                # node.nick first.
                node.nick        = "Speakers"
                node.description = "Speakers"
            }
        }
    }
]
