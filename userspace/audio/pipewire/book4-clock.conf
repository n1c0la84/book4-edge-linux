# Galaxy Book4 Edge 14": graph quantum 480 (10 ms), the DSP's fixed period.
#
# The speaker PCM moves in 480-frame periods (the kernel/DSP refuses other
# sizes) and cannot clock a graph itself (as driver its hw_ptr never moves),
# so it follows the mic, which the echo canceller (book4-mic-ns.conf, 480
# blocks) joins to every playback. PipeWire rounds the 480 request down to a
# power of two, 256: below one speaker period, so the follower's fill swung
# ~±480 around its target against a 256 threshold, "resync" every ~2 s with
# hundreds suppressed, heard as dirty, crackly sound (25 Nov 2026). At 480
# the threshold is one period. 960 also worked for the speakers but broke the
# echo canceller (1000 errors in 40 s).
# Install: ~/.config/pipewire/pipewire.conf.d/book4-clock.conf (or the package)
context.properties = {
    default.clock.min-quantum     = 480
    clock.power-of-two-quantum    = false
}
