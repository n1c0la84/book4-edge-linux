# Noise suppression for the Book4 Edge internal microphones (WebRTC).
# After Rafael Meneses' SB4-Edge-Linux (overlay/audio/60-sb4edge-mic-ns.conf,
# GPL-2.0), node names changed. The DMICs' own noise is an audible hiss at
# the gain speech needs; this adds a source "Microphone (noise suppression)"
# fed from the internal mics, with noise suppression, a high-pass filter and
# echo cancellation against whatever plays (monitor mode: no extra output
# device), and makes it the preferred input. The raw source stays selectable.
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and
#   systemctl --user restart pipewire pipewire-pulse wireplumber
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = true
      audio.channels = 1
      audio.position = [ MONO ]
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.high_pass_filter = true
        webrtc.extended_filter = true
        webrtc.delay_agnostic = true
        webrtc.gain_control = false
      }
      capture.props = {
        node.name = "capture.book4_mic_ns"
        target.object = "alsa_input.platform-sound.HiFi__Mic__source"
        node.passive = true
        node.dont-reconnect = false
      }
      source.props = {
        node.name = "book4_mic_ns"
        node.description = "Microphone (noise suppression)"
        priority.session = 3000
        priority.driver = 3000
      }
    }
  }
]
