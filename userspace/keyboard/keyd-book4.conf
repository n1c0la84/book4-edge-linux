# Book4 internal keyboard: the Copilot key acts as Super (hold for SUPER+key).
# The key has no keycode of its own: the firmware sends LeftShift+LeftMeta+F23
# together. keyd sees the three as a chord and turns it into the meta layer
# for as long as the key is held. Other keyboards are left alone.
[ids]
0cf2:9050

[main]
leftshift+leftmeta+f23 = layer(meta)
