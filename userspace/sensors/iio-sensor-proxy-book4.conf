# iio-sensor-proxy reading the ambient light sensor through the ADSP sensors
# domain (libssc). The VEML3328 is published as data type "color", not
# "ambient_light" (libssc-book4's LIBSSC_LIGHT_DATA_TYPE). docs/sensors.md.
[Unit]
# EL1 only until tested at EL2: upstream's 80-iio-sensor-proxy.rules tags
# every fastrpc-adsp as ssc-light/ssc-compass and starts this service, so the
# guard has to be here, not only in our udev rule (23 Nov: it started at EL2
# on install; no harm, the ADSP stayed attached).
ConditionPathExists=!/dev/kvm
Wants=book4-sensors.service
After=book4-sensors.service

[Service]
Environment=LIBSSC_LIGHT_DATA_TYPE=color
RestrictAddressFamilies=AF_QIPCRTR
# The sensor is published a few seconds after the sensors domain gets its
# registry; iio-sensor-proxy looks for sensors only once, at start.
ExecStartPre=/bin/sh -c 'for i in $(seq 30); do LIBSSC_LIGHT_DATA_TYPE=color /usr/bin/ssccli --sensor light --timeout 1 >/dev/null 2>&1 && exit 0; sleep 2; done; exit 0'
Restart=on-failure
RestartSec=5
