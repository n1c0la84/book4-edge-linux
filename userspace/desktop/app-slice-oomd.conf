# Book4: let systemd-oomd stop a runaway app before the desktop thrashes
# (24 October: no swap file any more, zram only). Only app.slice: apps and
# user services like llama-server, never session.slice (Hyprland, PipeWire).
# oomd kills the app group under the most memory pressure once pressure
# stays above 50 % for 30 s, or the one using the most swap once zram is
# 90 % full.
[Slice]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
ManagedOOMSwap=kill
