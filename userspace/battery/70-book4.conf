# Book4 (install/arch/battery-policy.sh): at critical battery, power off
# cleanly. "Auto" chose hybrid sleep/hibernation (the swap file exists), but
# hibernation's resume resets this machine, and on 20 October (EL2, no EFI
# variables then) the machine tried to sleep at the last percent and died. PercentageAction 3 rather than 2:
# the EC's reading lags.
[UPower]
UsePercentageForPolicy=true
PercentageCritical=5.0
PercentageAction=3.0
CriticalPowerAction=PowerOff
